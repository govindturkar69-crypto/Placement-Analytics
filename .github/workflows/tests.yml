name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # mysqlclient (pulled in by flask-mysqldb) only ships prebuilt wheels
      # for Windows -- on Linux it compiles from source and needs the MySQL
      # client headers and a compiler, neither present on a bare runner.
      - name: Install system dependencies for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -v
