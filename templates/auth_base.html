<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <title>{% block title %}Placement Analytics{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #050816;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ── AMBIENT GLOW — static, purely for depth ── */
    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      z-index: 0;
      pointer-events: none;
    }
    .glow-1 { width: 420px; height: 420px; background: rgba(99,102,241,0.14); top: -120px; left: -120px; }
    .glow-2 { width: 340px; height: 340px; background: rgba(16,185,129,0.09); bottom: -80px; right: -80px; }

    /* ── CARD ── */
    .auth-wrap { position: relative; z-index: 10; width: 100%; max-width: 400px; }
    .auth-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 40px 36px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 32px 80px rgba(0,0,0,0.5),
        0 0 80px rgba(99,102,241,0.06);
      animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
      position: relative;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .auth-card::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 50%, rgba(99,102,241,0.04) 100%);
      pointer-events: none;
    }
    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .auth-card.shake { animation: shakeX 0.3s ease; }

    /* ── BRAND ROW ── */
    .brand {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 28px;
    }
    .brand-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #6366f1, #10b981);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px;
      box-shadow: 0 6px 16px rgba(99,102,241,0.35), 0 0 0 1px rgba(255,255,255,0.08) inset;
      flex-shrink: 0;
    }
    .brand-text { font-size: 14px; font-weight: 700; color: white; letter-spacing: -0.2px; }
    .brand-sub { font-size: 11px; color: rgba(255,255,255,0.35); font-weight: 400; margin-top: 1px; }

    /* ── HEADING ── */
    .heading { margin-bottom: 26px; }
    .heading h1 { font-size: 23px; font-weight: 700; color: white; letter-spacing: -0.4px; margin-bottom: 5px; }
    .heading p { font-size: 13px; color: rgba(255,255,255,0.4); line-height: 1.5; }

    /* ── ALERT ── */
    .alert {
      padding: 11px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 500;
      margin-bottom: 18px;
      display: flex; align-items: center; gap: 8px;
    }
    .alert-danger  { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.2);  color: #fca5a5; }
    .alert-success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); color: #6ee7b7; }

    /* ── FORM ── */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,0.45); margin-bottom: 8px;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%); font-size: 15px;
      opacity: 0.4; pointer-events: none; transition: opacity 0.2s;
    }
    .input-wrap:focus-within .input-icon { opacity: 0.8; }
    .form-control {
      width: 100%;
      padding: 13px 14px 13px 42px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      font-size: 14px; color: white; outline: none;
      font-family: inherit; transition: all 0.2s ease;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.2); }
    .form-control:focus {
      border-color: rgba(99,102,241,0.6);
      background: rgba(99,102,241,0.06);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    .eye-btn {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: rgba(255,255,255,0.3);
      cursor: pointer; font-size: 15px;
      padding: 4px; transition: color 0.2s;
    }
    .eye-btn:hover { color: rgba(255,255,255,0.7); }

    /* ── BUTTON ── */
    .btn-submit {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white; border: none; border-radius: 12px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit; margin-top: 4px;
      position: relative; overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 24px rgba(99,102,241,0.3);
      letter-spacing: 0.2px;
    }
    .btn-submit::before {
      content: '';
      position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.5s;
    }
    .btn-submit:hover::before { left: 100%; }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(99,102,241,0.4); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit.loading { opacity: 0.7; pointer-events: none; }

    /* ── LINKS ── */
    .auth-footer { margin-top: 20px; text-align: center; }
    .auth-footer a {
      font-size: 12.5px; color: rgba(255,255,255,0.35);
      text-decoration: none; transition: color 0.2s;
    }
    .auth-footer a:hover { color: #818cf8; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; }
    .divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.06); }
    .divider-text { font-size: 11px; color: rgba(255,255,255,0.2); }

    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; }
    }

    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="auth-wrap">
  <div class="auth-card" id="authCard">
    <div class="brand">
      <div class="brand-icon">🎓</div>
      <div>
        <div class="brand-text">Placement Analytics</div>
        <div class="brand-sub">Smart placement management</div>
      </div>
    </div>

    {% block card_content %}{% endblock %}
  </div>
</div>

<script>
function togglePwd(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  const visible = input.type === 'text';
  input.type = visible ? 'password' : 'text';
  btn.textContent = visible ? '👁️' : '🙈';
}

function shakeCard() {
  const card = document.getElementById('authCard');
  card.classList.remove('shake');
  void card.offsetWidth; // restart the animation if it's already mid-shake
  card.classList.add('shake');
}

{% block extra_script %}{% endblock %}
</script>
</body>
</html>
