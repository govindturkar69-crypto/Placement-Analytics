<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0F172A">
  <title>{% block title %}Placement Analytics{% endblock %}</title>
  {% block meta %}
  <meta name="description" content="{% block description %}Smart Placement Analytics — college placement management platform with ML predictions, analytics, and automated reporting.{% endblock %}">
  {% endblock %}
  <meta name="robots" content="noindex, nofollow">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Smart Placement Analytics">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:url" content="{{ request.url }}">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ self.title() }}">
  <meta name="twitter:description" content="{{ self.description() }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F172A;
      --bg-elevated: #111C34;
      --primary: #2563EB;
      --primary-light: #3B82F6;
      --accent: #06B6D4;
      --success: #22C55E;
      --danger: #EF4444;
      --text: #F8FAFC;
      --text-muted: rgba(248, 250, 252, 0.55);
      --text-faint: rgba(248, 250, 252, 0.32);
      --border: rgba(248, 250, 252, 0.1);
      --card-bg: rgba(255, 255, 255, 0.04);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; color-scheme: dark; }

    /* Native cross-document page transition (Chromium) -- gives the
       login <-> forgot-password navigation a soft fade/slide instead of
       a hard cut. No-op, not an error, in browsers that don't support it. */
    @view-transition {
      navigation: auto;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      animation: pageFadeIn 0.4s var(--ease) both;
    }
    @keyframes pageFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── LAYOUT ── */
    .auth-layout {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      min-height: 100vh;
    }

    /* ── ILLUSTRATION PANEL (left) ── */
    .illustration-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 64px 72px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 900px 600px at 20% 15%, rgba(37, 99, 235, 0.18), transparent 60%),
        radial-gradient(ellipse 700px 500px at 85% 85%, rgba(6, 182, 212, 0.13), transparent 60%),
        var(--bg-elevated);
      border-right: 1px solid var(--border);
    }

    .illustration-copy { position: relative; z-index: 5; max-width: 460px; margin-bottom: 56px; }
    .illustration-copy h1 {
      font-size: 34px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #F8FAFC 40%, #93C5FD 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .illustration-copy p { font-size: 15px; color: var(--text-muted); line-height: 1.6; max-width: 400px; }

    .illustration-stage {
      position: relative;
      z-index: 5;
      height: 340px;
      width: 100%;
      max-width: 520px;
    }

    /* Glass card used for floating profile cards, chart cards, resume card.
       Single entrance transition only -- no continuous bob/float loop. */
    .float-card {
      position: absolute;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      animation: cardIn 0.6s var(--ease) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.94); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Student profile mini-card */
    .profile-card { width: 168px; padding: 14px; z-index: 4; }
    .profile-card .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: white;
      margin-bottom: 8px;
    }
    .profile-card .line { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.14); margin-bottom: 6px; }
    .profile-card .line.short { width: 60%; }
    .profile-card .badge {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 8px; padding: 3px 8px;
      border-radius: 20px;
      background: rgba(34, 197, 94, 0.14);
      color: var(--success);
      font-size: 10px; font-weight: 600;
    }
    .profile-card .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--success); }

    /* Resume scan card -- the scan beam sweeps once on entrance, then rests
       (a badge takes over to signal "done" instead of looping forever). */
    .scan-card { width: 130px; padding: 16px 14px; z-index: 3; overflow: hidden; }
    .scan-card .doc-line { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.12); margin-bottom: 7px; }
    .scan-card .doc-line:nth-child(3) { width: 70%; }
    .scan-beam {
      position: absolute;
      left: 0; right: 0; height: 26px; top: -30%;
      background: linear-gradient(180deg, transparent, rgba(6, 182, 212, 0.28), transparent);
      animation: scanSweep 1.1s var(--ease) 0.5s both;
    }
    @keyframes scanSweep {
      from { top: -30%; }
      to   { top: 100%; opacity: 0; }
    }

    /* Mini chart cards */
    .chart-card { padding: 16px; z-index: 2; }
    .chart-card .chart-label { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; font-weight: 600; }
    .bar-chart { display: flex; align-items: flex-end; gap: 5px; height: 46px; }
    .bar-chart .bar {
      width: 8px;
      border-radius: 3px 3px 0 0;
      background: linear-gradient(180deg, var(--accent), var(--primary));
      animation: barGrow 1s var(--ease) both;
      transform-origin: bottom;
    }
    @keyframes barGrow {
      from { transform: scaleY(0); opacity: 0; }
      to   { transform: scaleY(1); opacity: 1; }
    }
    .line-chart-path {
      stroke: var(--accent);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: drawLine 1.6s var(--ease) 0.3s both;
    }
    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }
    .donut-ring {
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      animation: drawLine 1.4s var(--ease) 0.4s both;
    }

    /* Flow diagram: Students -> Companies -> Placements */
    .flow-card { width: 100%; padding: 18px 20px; z-index: 2; }
    .flow-nodes { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .flow-node { text-align: center; }
    .flow-node .dot {
      width: 34px; height: 34px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      margin: 0 auto 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .flow-node:nth-child(1) .dot { background: rgba(37, 99, 235, 0.16); }
    .flow-node:nth-child(3) .dot { background: rgba(6, 182, 212, 0.16); }
    .flow-node:nth-child(5) .dot { background: rgba(34, 197, 94, 0.16); }
    .flow-node span { font-size: 10.5px; color: var(--text-muted); font-weight: 500; }
    .flow-track {
      flex: 1; height: 1px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      position: relative; margin: 0 6px 22px;
      transform: scaleX(0); transform-origin: left;
      animation: trackDraw 0.6s var(--ease) both;
    }
    @keyframes trackDraw { to { transform: scaleX(1); } }

    /* Security scene: a flat-style figure at a laptop (lock fields +
       success check) with a phone (verification code) alongside --
       shared by forgot_password.html and reset_password.html, both of
       which tell the same "resetting a password" story. Hand-drawn
       shapes, not an imported asset. */
    .scene-glow {
      position: absolute; width: 280px; height: 280px; border-radius: 50%;
      left: 50%; bottom: -20px; transform: translateX(-50%);
      background: radial-gradient(circle, rgba(37,99,235,0.28), transparent 70%);
      opacity: 0;
      animation: glowIn 1s var(--ease) 0.1s both;
      z-index: 1;
    }
    @keyframes glowIn { to { opacity: .7; } }
    .scene-person { position: absolute; left: 168px; bottom: 0; z-index: 4; animation: cardIn 0.6s var(--ease) 0.5s both; filter: drop-shadow(0 16px 20px rgba(0,0,0,0.35)); }
    @keyframes popIn { to { opacity: 1; transform: scale(1); } }

    .scene-laptop { bottom: 4px; left: 0; width: 218px; padding: 16px; z-index: 2; animation-delay: .1s; }
    .scene-laptop .laptop-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .scene-laptop .laptop-icon { font-size: 13px; opacity: .8; }
    .scene-laptop .laptop-bar { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); }
    .scene-laptop .laptop-bar.short { max-width: 60%; }
    .laptop-check {
      position: absolute; top: -10px; right: -10px;
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--success); color: #0F172A; font-weight: 800; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 18px rgba(34,197,94,0.4);
      opacity: 0; transform: scale(0.5);
      animation: popIn 0.4s var(--ease) 1.3s both;
    }

    .scene-phone { top: 6px; right: 18px; width: 108px; padding: 16px 12px; z-index: 2; animation-delay: .3s; text-align: center; }
    .scene-phone .phone-label { font-size: 9px; letter-spacing: 1px; color: var(--text-faint); text-transform: uppercase; font-weight: 700; margin-bottom: 10px; }
    .scene-phone .phone-code { display: flex; gap: 6px; justify-content: center; }
    .scene-phone .phone-code span { width: 16px; height: 22px; border-radius: 5px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); }
    .scene-phone .phone-code span.filled { background: rgba(6,182,212,0.18); border-color: rgba(6,182,212,0.45); }

    /* ── RIGHT PANEL (form) ── */
    .form-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
    }
    .form-panel::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 500px 400px at 50% 0%, rgba(37, 99, 235, 0.08), transparent 65%);
      pointer-events: none;
    }

    .auth-wrap { position: relative; z-index: 10; width: 100%; max-width: 400px; }
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 32px 80px rgba(0,0,0,0.45);
      animation: cardIn 0.5s var(--ease) both;
      position: relative;
    }
    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .auth-card.shake { animation: shakeX 0.3s var(--ease); }

    /* ── BRAND ── */
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
      flex-shrink: 0;
    }
    .brand-text { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; }
    .brand-sub { font-size: 11px; color: var(--text-faint); font-weight: 400; margin-top: 1px; }

    /* ── ICON BADGE (forgot/reset password card header) ── */
    .icon-wrap {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, rgba(37,99,235,0.22), rgba(6,182,212,0.12));
      border: 1px solid rgba(37,99,235,0.32);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      margin-bottom: 20px;
      box-shadow: 0 0 24px rgba(37,99,235,0.16);
    }

    /* ── HEADING ── */
    .heading { margin-bottom: 26px; }
    .heading h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 5px; }
    .heading p { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

    /* ── ALERT ── */
    .alert {
      padding: 11px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 500;
      margin-bottom: 18px;
      display: flex; align-items: center; gap: 8px;
    }
    .alert-danger  { background: rgba(239, 68, 68, 0.1);  border: 1px solid rgba(239, 68, 68, 0.2);  color: #fca5a5; }
    .alert-success { background: rgba(34, 197, 94, 0.1);  border: 1px solid rgba(34, 197, 94, 0.22); color: #86efac; }

    /* ── FORM ── */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 11px; font-weight: 600;
      color: var(--text-muted); margin-bottom: 8px;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%); font-size: 14px;
      opacity: 0.4; pointer-events: none; transition: opacity 0.2s var(--ease);
    }
    .input-wrap:focus-within .input-icon { opacity: 0.85; }
    .form-control {
      width: 100%;
      padding: 13px 14px 13px 42px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 11px;
      font-size: 14px; color: var(--text); outline: none;
      font-family: inherit; transition: all 0.2s var(--ease);
    }
    .form-control::placeholder { color: var(--text-faint); }
    .form-control:focus {
      border-color: var(--primary);
      background: rgba(37, 99, 235, 0.05);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }
    .form-control option {
      background-color: var(--bg-elevated);
      color: var(--text);
    }
    .eye-btn {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--text-faint);
      cursor: pointer; font-size: 14px;
      padding: 4px; transition: color 0.2s var(--ease);
    }
    .eye-btn:hover { color: var(--text); }

    /* ── CHECKBOX ── */
    .checkbox-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .checkbox-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--text-muted);
      cursor: pointer; user-select: none;
    }
    .checkbox-label input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 16px; height: 16px;
      border: 1.5px solid var(--border);
      border-radius: 5px;
      background: rgba(255,255,255,0.03);
      cursor: pointer;
      position: relative;
      transition: all 0.2s var(--ease);
      flex-shrink: 0;
    }
    .checkbox-label input[type="checkbox"]:checked {
      background: var(--primary);
      border-color: var(--primary);
    }
    .checkbox-label input[type="checkbox"]:checked::after {
      content: '';
      position: absolute; left: 4px; top: 1px;
      width: 4px; height: 8px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .link-muted { font-size: 13px; color: var(--text-muted); text-decoration: none; transition: color 0.2s var(--ease); }
    .link-muted:hover { color: var(--accent); }

    /* ── BUTTON ── */
    .btn-submit {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white; border: none; border-radius: 11px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit; margin-top: 4px;
      position: relative; overflow: hidden;
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
      box-shadow: 0 10px 26px rgba(37, 99, 235, 0.3);
      letter-spacing: 0.2px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-submit::before {
      content: '';
      position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent);
      transition: left 0.5s var(--ease);
    }
    .btn-submit:hover::before { left: 100%; }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 16px 32px rgba(37, 99, 235, 0.42); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit.loading { opacity: 0.85; pointer-events: none; }

    /* Branded loading indicator -- three pulsing dots, not a generic spinner ring */
    .btn-loader { display: none; align-items: center; gap: 4px; }
    .btn-submit.loading .btn-label { display: none; }
    .btn-submit.loading .btn-loader { display: flex; }
    .btn-loader span {
      width: 5px; height: 5px; border-radius: 50%;
      background: white;
      animation: dotPulse 1s ease-in-out infinite;
    }
    .btn-loader span:nth-child(2) { animation-delay: 0.15s; }
    .btn-loader span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dotPulse {
      0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
      30% { opacity: 1; transform: scale(1.15); }
    }

    /* ── OAUTH BUTTON ── */
    .btn-oauth {
      width: 100%; padding: 12px;
      background: #F8FAFC; color: #1E293B;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 11px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit; text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), background 0.2s var(--ease);
    }
    .btn-oauth:hover { background: #ffffff; transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,0.25); }
    .btn-oauth:active { transform: translateY(0); }
    .btn-oauth svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* ── LINKS / FOOTER ── */
    .auth-footer { margin-top: 20px; text-align: center; }
    .auth-footer a { font-size: 12.5px; color: var(--text-faint); text-decoration: none; transition: color 0.2s var(--ease); }
    .auth-footer a:hover { color: var(--accent); }
    .divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text { font-size: 11px; color: var(--text-faint); }

    /* ── RESPONSIVE ── */
    @media (max-width: 1024px) {
      .illustration-panel { display: none; }
      .auth-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; }
    }

    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>

<div class="auth-layout">
  <aside class="illustration-panel" id="illustrationPanel">
    {% block illustration %}{% endblock %}
  </aside>

  <main class="form-panel">
    <div class="auth-wrap">
      <div class="auth-card" id="authCard">
        <div class="brand">
          <div class="brand-icon">🎓</div>
          <div>
            <div class="brand-text">Placement Analytics</div>
            <div class="brand-sub">Smart placement management</div>
          </div>
        </div>

        {% block card_content %}{% endblock %}
      </div>
    </div>
  </main>
</div>

<script>
function togglePwd(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  const visible = input.type === 'text';
  input.type = visible ? 'password' : 'text';
  btn.textContent = visible ? '👁️' : '🙈';
}

function shakeCard() {
  const card = document.getElementById('authCard');
  card.classList.remove('shake');
  void card.offsetWidth; // restart the animation if it's already mid-shake
  card.classList.add('shake');
}

function setLoading(btn, isLoading) {
  btn.classList.toggle('loading', isLoading);
}

{% block extra_script %}{% endblock %}
</script>
</body>
</html>
