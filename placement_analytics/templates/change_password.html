{% extends "base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="page-header">
  <h1>🔑 Change Password</h1>
  <p>Update the password for your account</p>
</div>

<div class="card" style="max-width:500px">
  <div class="form-group">
    <label for="current_password">Current Password</label>
    <input type="password" id="current_password" class="form-control" placeholder="Enter your current password">
  </div>
  <div class="form-group">
    <label for="new_password">New Password</label>
    <input type="password" id="new_password" class="form-control" placeholder="At least 6 characters">
  </div>
  <div class="form-group">
    <label for="confirm_password">Confirm New Password</label>
    <input type="password" id="confirm_password" class="form-control" placeholder="Re-enter the new password">
  </div>
  <div class="form-actions">
    <button class="btn-primary" style="width:auto;padding:11px 24px" onclick="submitChangePassword()">
      💾 Update Password
    </button>
    <a href="{{ url_for('profile') }}" class="btn-outline">Cancel</a>
  </div>
</div>

<script>
function submitChangePassword() {
  const fields = ['current_password', 'new_password', 'confirm_password'];
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = '/change_password';
  fields.forEach(f => {
    const inp = document.createElement('input');
    inp.type = 'hidden';
    inp.name = f;
    inp.value = document.getElementById(f).value;
    form.appendChild(inp);
  });
  const csrf = document.createElement('input');
  csrf.type = 'hidden'; csrf.name = 'csrf_token'; csrf.value = '{{ csrf_token() }}';
  form.appendChild(csrf);
  document.body.appendChild(form);
  form.submit();
}
</script>
{% endblock %}
